timeout: 1
default_entry: 1

${BOOT}=boot():/boot

/ENAos (Text Mode)
    protocol: multiboot2
    kernel_path: ${BOOT}/kernel.elf
    textmode: yes
    module_path: ${BOOT}/init.bin
    module_string: init
    module_path: ${BOOT}/initramfs.cpio
    module_string: initramfs

/ENAos (Graphics)
    protocol: multiboot2
    kernel_path: ${BOOT}/kernel.elf
    textmode: no
    module_path: ${BOOT}/init.bin
    module_string: init
    module_path: ${BOOT}/initramfs.cpio
    module_string: initramfs
